<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Asteroids — DeepSeek v4 Pro</title>
<style>
  :root { --primary: #c084fc; --glow: rgba(192,132,252,0.6); --accent: #fbbf24; --bg: #09090b; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: var(--primary); }
  canvas { position: fixed; inset: 0; display: block; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; pointer-events: none; z-index: 2;
    display: flex; justify-content: space-between; padding: 20px 28px;
    font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase;
    text-shadow: 0 0 12px var(--glow); font-weight: 600;
  }
  #hud span { color: var(--accent); text-shadow: 0 0 10px var(--accent); }
  #overlay {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  #overlay h1 {
    font-size: clamp(38px, 9vw, 100px); font-weight: 800; letter-spacing: 10px;
    text-shadow: 0 0 22px var(--primary), 0 0 50px var(--glow);
    margin-bottom: 8px;
  }
  #overlay p { font-size: 14px; letter-spacing: 3px; opacity: .75; margin-top: 8px; }
  #overlay .help { margin-top: 30px; font-size: 12px; letter-spacing: 2px; opacity: .6; line-height: 2; }
  #overlay .prompt { margin-top: 22px; color: var(--accent); letter-spacing: 3px; font-size: 13px; text-shadow: 0 0 12px var(--accent); }
  @keyframes pulse { 50% { opacity: .25; } }
  .blink { animation: pulse 1.2s ease-in-out infinite; }
  .hidden { display: none !important; }
  #footer {
    position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
    font-size: 10px; letter-spacing: 2px; opacity: .35; pointer-events: none; z-index: 2;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div>SCORE <span id="scoreVal">0</span></div>
  <div>WAVE <span id="waveVal">1</span></div>
  <div>LIVES <span id="livesVal">▲▲▲</span></div>
</div>

<div id="overlay">
  <h1>ASTEROIDS</h1>
  <p>DEEPSEEK V4 PRO</p>
  <div class="help">
    ◀ ▶ &nbsp;ROTATE &nbsp;&nbsp; ▲ &nbsp;THRUST &nbsp;&nbsp; [SPACE] &nbsp;FIRE
  </div>
  <div class="prompt blink" id="prompt">PRESS ANY KEY</div>
</div>
<div id="footer">DeepSeek v4 Pro · Fireworks.ai · client-only</div>

<script>
(() => {
  const c = document.getElementById("c");
  const ctx = c.getContext("2d");
  const scoreEl = document.getElementById("scoreVal");
  const waveEl = document.getElementById("waveVal");
  const livesEl = document.getElementById("livesVal");
  const overlay = document.getElementById("overlay");
  const prompt = document.getElementById("prompt");

  let W, H, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    c.style.width = W + "px"; c.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize); resize();

  // state
  let gameState = "menu";   // menu | play | over
  let score = 0, lives = 3, waveNum = 1;
  let ship, asteroids = [], bullets = [], particles = [], stars = [];
  let frame = 0, lastShot = 0, invuln = 0;
  const keys = {};

  // tuning
  const TURN   = 0.07;
  const THRUST = 0.12;
  const MAX_V  = 6.5;
  const DRAG   = 0.992;
  const BULLET_V = 9.5;
  const BULLET_TTL = 55;
  const COOLDOWN  = 12;
  const SHIP_R = 12;

  // stars
  function buildStars() {
    stars = [];
    for (let i = 0; i < 200; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        z: 0.15 + Math.random() * 0.85,
        p: Math.random() * Math.PI * 2
      });
    }
  }
  buildStars();

  // helpers
  const rand = (a, b) => a + Math.random() * (b - a);
  const wrp  = (v, m) => (v % m + m) % m;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  function newShip() {
    return { x: W/2, y: H/2, vx: 0, vy: 0, a: -Math.PI/2, r: SHIP_R, alive: true };
  }

  function makeAsteroid(x, y, sz) {
    const baseR = sz === 3 ? 48 : sz === 2 ? 30 : 17;
    const pts   = [];
    for (let i = 0; i < 11; i++) {
      pts.push({ a: (i/11)*Math.PI*2, r: baseR * rand(0.72, 1.22) });
    }
    const ang = rand(0, Math.PI*2);
    const sp  = rand(0.5, 1.4) + waveNum * 0.04;
    return { x, y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp, r: baseR, sz, pts, rot: 0, vr: rand(-0.022, 0.022) };
  }

  function spawn(n, sz) {
    for (let i = 0; i < n; i++) {
      let x, y;
      do { x = rand(0, W); y = rand(0, H); } while (ship && dist({x,y}, ship) < 170);
      asteroids.push(makeAsteroid(x, y, sz));
    }
  }

  function startGame() {
    score = 0; lives = 3; waveNum = 1;
    asteroids = []; bullets = []; particles = [];
    ship = newShip(); spawn(4, 3); invuln = 130;
    gameState = "play"; overlay.classList.add("hidden"); refreshHUD();
  }

  function refreshHUD() {
    scoreEl.textContent = score;
    waveEl.textContent = waveNum;
    livesEl.textContent = lives > 0 ? "▲".repeat(lives) : "×";
  }

  function fire() {
    if (gameState !== "play" || frame - lastShot < COOLDOWN) return;
    lastShot = frame;
    bullets.push({
      x: ship.x + Math.cos(ship.a) * ship.r,
      y: ship.y + Math.sin(ship.a) * ship.r,
      vx: Math.cos(ship.a) * BULLET_V + ship.vx,
      vy: Math.sin(ship.a) * BULLET_V + ship.vy,
      ttl: BULLET_TTL
    });
  }

  function explode(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI*2), s = rand(0.4, 4.8);
      particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 28 + rand(0, 34), max: 62, color });
    }
  }

  function bust(idx) {
    const a = asteroids[idx];
    const col = a.sz === 3 ? "#c084fc" : a.sz === 2 ? "#a78bfa" : "#ddd6fe";
    explode(a.x, a.y, col, 16 + a.sz * 8);
    score += a.sz === 3 ? 20 : a.sz === 2 ? 50 : 100; refreshHUD();
    if (a.sz > 1) {
      for (let k = 0; k < 2; k++) {
        const kid = makeAsteroid(a.x, a.y, a.sz - 1);
        const ang = rand(0, Math.PI*2);
        kid.vx = Math.cos(ang) * (1.6 + Math.random()); kid.vy = Math.sin(ang) * (1.6 + Math.random());
        asteroids.push(kid);
      }
    }
    asteroids.splice(idx, 1);
  }

  function die() {
    if (invuln > 0) return;
    explode(ship.x, ship.y, "#fbbf24", 44); ship.alive = false; lives--; refreshHUD();
    if (lives <= 0) {
      gameState = "over"; overlay.classList.remove("hidden");
      overlay.querySelector("h1").textContent = "GAME OVER";
      prompt.textContent = "PRESS ANY KEY";
    } else {
      setTimeout(() => { ship = newShip(); invuln = 130; gameState = "play"; }, 1300);
    }
  }

  // input
  window.addEventListener("keydown", e => {
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
    keys[e.code] = true;
    if (gameState === "menu") startGame();
    else if (gameState === "over") startGame();
    else if (e.code === "Space") fire();
  });
  window.addEventListener("keyup", e => keys[e.code] = false);

  // update
  function update() {
    frame++;
    if (gameState === "play") {
      if (keys["ArrowLeft"])  ship.a -= TURN;
      if (keys["ArrowRight"]) ship.a += TURN;
      ship.thrusting = !!keys["ArrowUp"];
      if (keys["ArrowUp"]) {
        ship.vx += Math.cos(ship.a) * THRUST;
        ship.vy += Math.sin(ship.a) * THRUST;
        if (frame % 3 === 0) explode(ship.x - Math.cos(ship.a)*10, ship.y - Math.sin(ship.a)*10, "#fbbf24", 2);
      }
      let sp = Math.hypot(ship.vx, ship.vy);
      if (sp > MAX_V) { ship.vx = ship.vx/sp * MAX_V; ship.vy = ship.vy/sp * MAX_V; }
      ship.vx *= DRAG; ship.vy *= DRAG;
      ship.x = wrp(ship.x + ship.vx, W); ship.y = wrp(ship.y + ship.vy, H);
      if (invuln > 0) invuln--;

      // bullets
      for (let i = bullets.length-1; i >= 0; i--) {
        const b = bullets[i]; b.x = wrp(b.x + b.vx, W); b.y = wrp(b.y + b.vy, H); b.ttl--;
        if (b.ttl <= 0) bullets.splice(i, 1);
      }
      // asteroids
      for (const a of asteroids) { a.x = wrp(a.x + a.vx, W); a.y = wrp(a.y + a.vy, H); a.rot += a.vr; }
      // bullet-asteroid
      for (let i = bullets.length-1; i >= 0; i--) {
        for (let j = asteroids.length-1; j >= 0; j--) {
          if (dist(bullets[i], asteroids[j]) < bullets[i].r + asteroids[j].r * 0.78) {
            bullets.splice(i, 1); bust(j); break;
          }
        }
      }
      // ship-asteroid
      if (ship.alive && invuln <= 0) {
        for (const a of asteroids) if (dist(ship, a) < ship.r + a.r * 0.72) { die(); break; }
      }
      if (asteroids.length === 0) { waveNum++; refreshHUD(); spawn(4 + waveNum, 3); }
    }

    // particles
    for (let i = particles.length-1; i >= 0; i--) {
      const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (const s of stars) s.p += 0.04;
  }

  // render
  function drawStars() {
    for (const s of stars) {
      const a = 0.2 + 0.45 * Math.sin(s.p) + 0.15;
      ctx.globalAlpha = a * s.z;
      ctx.fillStyle = "#c4b5fd";
      ctx.fillRect(s.x, s.y, s.z * 2.2, s.z * 2.2);
    }
    ctx.globalAlpha = 1;
  }

  function drawShip() {
    if (!ship || !ship.alive) return;
    if (invuln > 0 && Math.floor(frame/5) % 2 === 0) return;
    ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.a);
    ctx.beginPath(); ctx.moveTo(ship.r, 0); ctx.lineTo(-ship.r*0.75, ship.r*0.6); ctx.lineTo(-ship.r*0.4, 0); ctx.lineTo(-ship.r*0.75, -ship.r*0.6); ctx.closePath();
    ctx.strokeStyle = "#c084fc"; ctx.lineWidth = 2.2; ctx.shadowColor = "#c084fc"; ctx.shadowBlur = 20; ctx.stroke();
    if (ship.thrusting && frame % 2 === 0) {
      ctx.beginPath(); ctx.moveTo(-ship.r*0.5, 0); ctx.lineTo(-ship.r*2, -ship.r*0.28); ctx.lineTo(-ship.r*2, ship.r*0.28); ctx.closePath();
      ctx.strokeStyle = "#fbbf24"; ctx.shadowColor = "#fbbf24"; ctx.shadowBlur = 14; ctx.stroke();
    }
    ctx.restore();
  }

  function drawAsteroid(a) {
    ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.rot);
    ctx.beginPath();
    for (let i = 0; i < a.pts.length; i++) {
      const p = a.pts[i];
      const x = Math.cos(p.a) * p.r, y = Math.sin(p.a) * p.r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    const col = a.sz === 3 ? "#c084fc" : a.sz === 2 ? "#a78bfa" : "#ddd6fe";
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.stroke();
    ctx.restore();
  }

  function drawBullets() {
    ctx.fillStyle = "#fef3c7"; ctx.shadowColor = "#fbbf24"; ctx.shadowBlur = 10;
    for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 2.6, 0, Math.PI*2); ctx.fill(); }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.shadowBlur = 7; ctx.shadowColor = p.color; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.9, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "rgba(9, 9, 11, 0.38)"; ctx.fillRect(0, 0, W, H);
    drawStars();
    for (const a of asteroids) drawAsteroid(a);
    drawBullets(); drawParticles(); drawShip();
  }

  // boot
  ship = newShip(); spawn(8, 3); // idle drifting asteroids behind menu
  !function loop() { update(); render(); requestAnimationFrame(loop); }();
})();
</script>
</body>
</html>
