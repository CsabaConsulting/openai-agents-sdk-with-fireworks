<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Asteroids — Kimi 2.7 Code</title>
<style>
  :root { --neon: #39ff14; --accent: #ff00a0; --bg: #05050a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; font-family: 'Courier New', monospace; color: var(--neon); }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 22px 24px; }
  #top { display: flex; justify-content: space-between; font-size: 14px; letter-spacing: 2px; text-shadow: 0 0 10px var(--neon); }
  #center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #center h1 { font-size: clamp(36px, 8vw, 90px); text-shadow: 0 0 20px var(--neon), 0 0 45px var(--accent); letter-spacing: 8px; }
  #center p { margin-top: 12px; font-size: 14px; letter-spacing: 3px; opacity: 0.8; }
  #center .blink { margin-top: 26px; animation: blink 1s steps(2) infinite; color: var(--accent); text-shadow: 0 0 12px var(--accent); }
  @keyframes blink { 50% { opacity: 0.2; } }
  .hidden { display: none !important; }
  #bottom { text-align: center; font-size: 11px; opacity: 0.5; letter-spacing: 1px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="top"><span>SCORE <span id="score">0</span></span><span>SHIPS <span id="lives">3</span></span></div>
  <div id="center">
    <h1>ASTEROIDS</h1>
    <p>ARROW KEYS TURN & THRUST &nbsp;·&nbsp; SPACE SHOOTS</p>
    <div class="blink" id="hint">PRESS ANY KEY</div>
  </div>
  <div id="bottom">Kimi 2.7 Code · Fireworks.ai · client-only demo</div>
</div>
<script>
(() => {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const center = document.getElementById('center');
  const hint = document.getElementById('hint');

  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * DPR; c.height = H * DPR;
    c.style.width = W + 'px'; c.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const keys = {};
  window.addEventListener('keydown', e => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    keys[e.code] = true;
    if (state === 'menu') startGame();
    else if (state === 'over') startGame();
    else if (e.code === 'Space') shoot();
  });
  window.addEventListener('keyup', e => keys[e.code] = false);

  let state = 'menu';
  let score = 0, lives = 3, wave = 1;
  let ship, asteroids = [], bullets = [], particles = [], stars = [];
  let lastShot = 0, frame = 0, invuln = 0;

  const TURN = 0.08, THRUST = 0.14, MAXV = 6.5, FRICTION = 0.985;
  const BULLET_SPEED = 10, BULLET_LIFE = 50, SHOT_CD = 12;

  function makeStars() {
    stars = [];
    for (let i = 0; i < 140; i++) stars.push({ x: Math.random()*W, y: Math.random()*H, z: Math.random()*0.8+0.2, tw: Math.random()*Math.PI*2 });
  }
  makeStars();

  function newShip() {
    return { x: W/2, y: H/2, vx: 0, vy: 0, a: -Math.PI/2, r: 12, alive: true };
  }

  function makeAsteroid(x, y, size) {
    const r = size === 3 ? 45 : size === 2 ? 28 : 16;
    const verts = [];
    for (let i = 0; i < 10; i++) verts.push({ a: i/10*Math.PI*2, r: r*(0.75+Math.random()*0.4) });
    const a = Math.random()*Math.PI*2;
    const sp = 0.7 + Math.random()*1.2 + wave*0.05;
    return { x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, r, size, verts, rot: 0, vr: (Math.random()-0.5)*0.04 };
  }

  function spawnAsteroids(n, size) {
    for (let i = 0; i < n; i++) {
      let x, y;
      do { x = Math.random()*W; y = Math.random()*H; } while (ship && Math.hypot(x-ship.x, y-ship.y) < 160);
      asteroids.push(makeAsteroid(x, y, size));
    }
  }

  function startGame() {
    score = 0; lives = 3; wave = 1; asteroids = []; bullets = []; particles = [];
    ship = newShip(); spawnAsteroids(4, 3); invuln = 120;
    state = 'playing'; center.classList.add('hidden'); updateHUD();
  }

  function updateHUD() { scoreEl.textContent = score; livesEl.textContent = lives; }

  function shoot() {
    if (state !== 'playing' || frame - lastShot < SHOT_CD) return;
    lastShot = frame;
    bullets.push({
      x: ship.x + Math.cos(ship.a)*ship.r,
      y: ship.y + Math.sin(ship.a)*ship.r,
      vx: Math.cos(ship.a)*BULLET_SPEED + ship.vx,
      vy: Math.sin(ship.a)*BULLET_SPEED + ship.vy,
      life: BULLET_LIFE
    });
  }

  function explode(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random()*Math.PI*2, s = Math.random()*4+0.5;
      particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 30+Math.random()*30, max: 60, color });
    }
  }

  function wrap(v, m) { return (v % m + m) % m; }
  function hit(a, b) { return Math.hypot(a.x-b.x, a.y-b.y) < (a.r+b.r)*0.8; }

  function destroy(i) {
    const a = asteroids[i];
    explode(a.x, a.y, a.size === 3 ? '#39ff14' : a.size === 2 ? '#00ffcc' : '#ccffff', 16 + a.size*7);
    score += a.size === 3 ? 20 : a.size === 2 ? 50 : 100; updateHUD();
    if (a.size > 1) {
      for (let k = 0; k < 2; k++) {
        const child = makeAsteroid(a.x, a.y, a.size-1);
        const ang = Math.random()*Math.PI*2;
        child.vx = Math.cos(ang)*(1.5+Math.random()); child.vy = Math.sin(ang)*(1.5+Math.random());
        asteroids.push(child);
      }
    }
    asteroids.splice(i, 1);
  }

  function die() {
    if (invuln > 0) return;
    explode(ship.x, ship.y, '#ff00a0', 40); ship.alive = false; lives--; updateHUD();
    if (lives <= 0) {
      state = 'over'; center.classList.remove('hidden');
      center.querySelector('h1').textContent = 'GAME OVER'; hint.textContent = 'PRESS ANY KEY';
    } else {
      state = 'dead'; setTimeout(() => { ship = newShip(); invuln = 120; state = 'playing'; }, 1200);
    }
  }

  function update() {
    frame++;
    if (state === 'playing') {
      if (keys['ArrowLeft']) ship.a -= TURN;
      if (keys['ArrowRight']) ship.a += TURN;
      ship.thrusting = !!keys['ArrowUp'];
      if (keys['ArrowUp']) { ship.vx += Math.cos(ship.a)*THRUST; ship.vy += Math.sin(ship.a)*THRUST; }
      const v = Math.hypot(ship.vx, ship.vy);
      if (v > MAXV) { ship.vx = ship.vx/v*MAXV; ship.vy = ship.vy/v*MAXV; }
      ship.vx *= FRICTION; ship.vy *= FRICTION;
      ship.x = wrap(ship.x + ship.vx, W); ship.y = wrap(ship.y + ship.vy, H);
      if (invuln > 0) invuln--;
      if (ship.thrusting && frame % 2 === 0) explode(ship.x - Math.cos(ship.a)*10, ship.y - Math.sin(ship.a)*10, '#ffaa00', 3);

      for (let i = bullets.length-1; i >= 0; i--) {
        const b = bullets[i]; b.x = wrap(b.x + b.vx, W); b.y = wrap(b.y + b.vy, H); b.life--;
        if (b.life <= 0) bullets.splice(i, 1);
      }
      for (const a of asteroids) { a.x = wrap(a.x + a.vx, W); a.y = wrap(a.y + a.vy, H); a.rot += a.vr; }

      for (let i = bullets.length-1; i >= 0; i--) {
        for (let j = asteroids.length-1; j >= 0; j--) {
          if (hit(bullets[i], asteroids[j])) { bullets.splice(i, 1); destroy(j); break; }
        }
      }
      if (ship.alive && invuln <= 0) for (const a of asteroids) if (hit(ship, a)) { die(); break; }
      if (asteroids.length === 0) { wave++; spawnAsteroids(4+wave, 3); }
    }

    for (let i = particles.length-1; i >= 0; i--) {
      const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vx *= 0.95; p.vy *= 0.95; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (const s of stars) s.tw += 0.04;
  }

  function drawStars() {
    ctx.shadowBlur = 0;
    for (const s of stars) {
      ctx.globalAlpha = 0.3 + 0.5*Math.sin(s.tw);
      ctx.fillStyle = '#9fd0ff'; ctx.fillRect(s.x, s.y, s.z*2, s.z*2);
    }
    ctx.globalAlpha = 1;
  }

  function drawShip() {
    if (!ship || !ship.alive) return;
    if (invuln > 0 && Math.floor(frame/4)%2 === 0) return;
    ctx.save();
    ctx.translate(ship.x, ship.y); ctx.rotate(ship.a);
    ctx.beginPath(); ctx.moveTo(ship.r, 0); ctx.lineTo(-ship.r*0.7, ship.r*0.6); ctx.lineTo(-ship.r*0.4, 0); ctx.lineTo(-ship.r*0.7, -ship.r*0.6); ctx.closePath();
    ctx.strokeStyle = '#39ff14'; ctx.lineWidth = 2; ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 18; ctx.stroke();
    if (ship.thrusting && frame % 2 === 0) {
      ctx.beginPath(); ctx.moveTo(-ship.r*0.5, 0); ctx.lineTo(-ship.r*1.8, 0); ctx.lineTo(-ship.r*0.6, ship.r*0.25); ctx.lineTo(-ship.r*0.6, -ship.r*0.25); ctx.closePath();
      ctx.strokeStyle = '#ffaa00'; ctx.shadowColor = '#ffaa00'; ctx.stroke();
    }
    ctx.restore();
  }

  function drawAsteroid(a) {
    ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.rot);
    ctx.beginPath();
    for (let i = 0; i < a.verts.length; i++) {
      const v = a.verts[i];
      const x = Math.cos(v.a)*v.r, y = Math.sin(v.a)*v.r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = a.size === 3 ? '#39ff14' : a.size === 2 ? '#00ffcc' : '#ccffff';
    ctx.lineWidth = 2; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 12; ctx.stroke();
    ctx.restore();
  }

  function drawBullets() {
    ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 10;
    for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 2.5, 0, Math.PI*2); ctx.fill(); }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life/p.max); ctx.shadowBlur = 8; ctx.shadowColor = p.color; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = 'rgba(5, 5, 10, 0.4)'; ctx.fillRect(0, 0, W, H);
    drawStars();
    for (const a of asteroids) drawAsteroid(a);
    drawBullets(); drawParticles(); drawShip();
  }

  ship = newShip(); spawnAsteroids(8, 3); // idle background
  function loop() { update(); render(); requestAnimationFrame(loop); }
  loop();
})();
</script>
</body>
</html>
