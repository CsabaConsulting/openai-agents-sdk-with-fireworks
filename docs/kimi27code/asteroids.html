<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asteroids</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #050510;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #overlay {
    position: absolute;
    top: 24px;
    left: 24px;
    color: #a0e0ff;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(80, 200, 255, 0.6);
  }
  #overlay h1 {
    margin: 0 0 6px 0;
    font-size: 24px;
    letter-spacing: 2px;
  }
  #overlay p {
    margin: 0;
    font-size: 14px;
    opacity: 0.85;
  }
  #message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ffffff;
    font-size: 28px;
    letter-spacing: 3px;
    text-shadow: 0 0 16px rgba(0, 200, 255, 0.8);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay">
  <h1>ASTEROIDS</h1>
  <p>Arrow keys to turn & thrust • Space to shoot</p>
  <p>Score: <span id="score">0</span> | Lives: <span id="lives">3</span></p>
</div>
<div id="message"></div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const messageEl = document.getElementById('message');

  let width, height;
  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
  }
  window.addEventListener('resize', resize);
  resize();

  const DEG = Math.PI / 180;
  const rand = (min, max) => Math.random() * (max - min) + min;
  const wrap = (v, max) => v < 0 ? v + max : v >= max ? v - max : v;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  const keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ' ': false };
  window.addEventListener('keydown', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
  window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

  let score = 0;
  let lives = 3;
  let gameOver = false;
  let invuln = 0;
  let lastShot = 0;

  const ship = {
    x: width / 2,
    y: height / 2,
    angle: -90,
    vx: 0,
    vy: 0,
    radius: 12
  };

  const bullets = [];
  const asteroids = [];
  const particles = [];
  const stars = [];

  for (let i = 0; i < 120; i++) {
    stars.push({ x: rand(0, width), y: rand(0, height), size: rand(0.5, 2), alpha: rand(0.2, 0.8) });
  }

  function spawnAsteroids(count, size) {
    for (let i = 0; i < count; i++) {
      let x, y, safe = false;
      while (!safe) {
        x = rand(0, width);
        y = rand(0, height);
        safe = dist({ x, y }, ship) > 120;
      }
      asteroids.push(createAsteroid(x, y, size));
    }
  }

  function createAsteroid(x, y, size) {
    const vertices = Math.floor(rand(7, 11));
    const points = [];
    for (let i = 0; i < vertices; i++) {
      const a = (i / vertices) * Math.PI * 2;
      points.push({ a, r: size * rand(0.55, 1.0) });
    }
    return {
      x, y,
      size,
      points,
      angle: rand(0, Math.PI * 2),
      va: rand(-1.5, 1.5) * DEG,
      vx: rand(-1.2, 1.2) * (30 / size),
      vy: rand(-1.2, 1.2) * (30 / size),
      radius: size * 0.9
    };
  }

  function startLevel() {
    asteroids.length = 0;
    bullets.length = 0;
    ship.x = width / 2;
    ship.y = height / 2;
    ship.vx = 0;
    ship.vy = 0;
    ship.angle = -90;
    invuln = 120;
    spawnAsteroids(4 + Math.floor(score / 5000), 50);
  }
  startLevel();

  function showMessage(text) {
    messageEl.textContent = text;
    messageEl.style.opacity = '1';
    setTimeout(() => messageEl.style.opacity = '0', 2000);
  }

  function explode(x, y, color, count = 16) {
    for (let i = 0; i < count; i++) {
      const a = rand(0, Math.PI * 2);
      const s = rand(1, 4);
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: rand(30, 70),
        color,
        size: rand(1, 3)
      });
    }
  }

  function update() {
    if (gameOver) return;

    if (keys.ArrowLeft) ship.angle -= 4;
    if (keys.ArrowRight) ship.angle += 4;

    const rad = ship.angle * DEG;
    if (keys.ArrowUp) {
      ship.vx += Math.cos(rad) * 0.18;
      ship.vy += Math.sin(rad) * 0.18;
      const px = ship.x - Math.cos(rad) * 14;
      const py = ship.y - Math.sin(rad) * 14;
      for (let i = 0; i < 2; i++) {
        particles.push({
          x: px + rand(-3, 3), y: py + rand(-3, 3),
          vx: ship.vx - Math.cos(rad) * rand(1, 3) + rand(-0.5, 0.5),
          vy: ship.vy - Math.sin(rad) * rand(1, 3) + rand(-0.5, 0.5),
          life: rand(15, 30),
          color: '#ff8844',
          size: rand(1, 2.5)
        });
      }
    }

    ship.vx *= 0.985;
    ship.vy *= 0.985;
    ship.x = wrap(ship.x + ship.vx, width);
    ship.y = wrap(ship.y + ship.vy, height);

    if (keys[' '] && Date.now() - lastShot > 180) {
      lastShot = Date.now();
      bullets.push({
        x: ship.x + Math.cos(rad) * 14,
        y: ship.y + Math.sin(rad) * 14,
        vx: ship.vx + Math.cos(rad) * 8,
        vy: ship.vy + Math.sin(rad) * 8,
        life: 55
      });
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x = wrap(b.x + b.vx, width);
      b.y = wrap(b.y + b.vy, height);
      b.life--;
      if (b.life <= 0) bullets.splice(i, 1);
    }

    for (let i = asteroids.length - 1; i >= 0; i--) {
      const a = asteroids[i];
      a.angle += a.va;
      a.x = wrap(a.x + a.vx, width);
      a.y = wrap(a.y + a.vy, height);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    collisionChecks();

    if (asteroids.length === 0) {
      score += 500;
      showMessage('LEVEL CLEAR +500');
      startLevel();
    }

    if (invuln > 0) invuln--;
  }

  function collisionChecks() {
    for (let i = asteroids.length - 1; i >= 0; i--) {
      const a = asteroids[i];
      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        if (dist(a, b) < a.radius) {
          bullets.splice(j, 1);
          destroyAsteroid(i, a);
          score += a.size === 50 ? 100 : a.size === 25 ? 200 : 400;
          break;
        }
      }
    }

    if (invuln <= 0) {
      for (const a of asteroids) {
        if (dist(a, ship) < a.radius + ship.radius - 4) {
          explode(ship.x, ship.y, '#44ccff', 40);
          explode(a.x, a.y, '#aaaaaa', 20);
          lives--;
          if (lives > 0) {
            showMessage('CRASHED!');
            startLevel();
          } else {
            gameOver = true;
            showMessage('GAME OVER\nScore ' + score);
          }
          return;
        }
      }
    }

    scoreEl.textContent = score;
    livesEl.textContent = lives;
  }

  function destroyAsteroid(i, a) {
    asteroids.splice(i, 1);
    explode(a.x, a.y, '#aaaaaa', 18);
    if (a.size > 14) {
      asteroids.push(createAsteroid(a.x, a.y, a.size / 2));
      asteroids.push(createAsteroid(a.x, a.y, a.size / 2));
    }
  }

  function draw() {
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars) {
      ctx.fillStyle = `rgba(200, 220, 255, ${s.alpha})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = '#00e0ff';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#00e0ff';
    ctx.shadowBlur = 10;
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle * DEG);
    ctx.beginPath();
    ctx.moveTo(18, 0);
    ctx.lineTo(-12, -10);
    ctx.lineTo(-8, 0);
    ctx.lineTo(-12, 10);
    ctx.closePath();
    ctx.stroke();
    if (invuln > 0 && Math.floor(invuln / 6) % 2 === 0) {
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.arc(0, 0, 20, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();

    for (const b of bullets) {
      ctx.save();
      ctx.fillStyle = '#ffee88';
      ctx.shadowColor = '#ffee88';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (const a of asteroids) {
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.angle);
      ctx.strokeStyle = '#bbbbcc';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#8888aa';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      for (let i = 0; i < a.points.length; i++) {
        const p = a.points[i];
        const x = Math.cos(p.a) * p.r;
        const y = Math.sin(p.a) * p.r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }

    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = p.life / 40;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
