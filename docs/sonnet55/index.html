<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Asteroids</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize() {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
  }
  addEventListener('resize', resize);
  resize();

  // ---- Input ----
  const keys = {};
  let shootPressed = false;
  addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space' && !keys.Space) shootPressed = true;
    keys[e.code] = true;
    if (e.code === 'Enter' && state !== 'playing') startGame();
  });
  addEventListener('keyup', e => { keys[e.code] = false; });

  // ---- Helpers ----
  const rand = (a, b) => a + Math.random() * (b - a);
  const wrap = o => {
    if (o.x < -o.r) o.x = W + o.r;
    if (o.x > W + o.r) o.x = -o.r;
    if (o.y < -o.r) o.y = H + o.r;
    if (o.y > H + o.r) o.y = -o.r;
  };
  const dist = (a, b) => {
    // shortest distance with no wrapping; wrap handled by object positions
    return Math.hypot(a.x - b.x, a.y - b.y);
  };

  // ---- Game state ----
  let state = 'title'; // title | playing | over
  let ship, bullets, rocks, particles, score, lives, level, stars, shake, levelMsgTimer;

  stars = Array.from({ length: 150 }, () => ({
    x: Math.random(), y: Math.random(), z: rand(0.2, 1)
  }));

  function startGame() {
    score = 0; lives = 3; level = 1;
    bullets = []; particles = []; shake = 0;
    resetShip();
    spawnLevel();
    state = 'playing';
  }

  function resetShip() {
    ship = { x: W / 2, y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2, r: 14,
             cool: 0, invuln: 120, thrust: false };
  }

  function spawnLevel() {
    rocks = [];
    const n = 3 + level;
    for (let i = 0; i < n; i++) {
      let x, y;
      do { x = rand(0, W); y = rand(0, H); }
      while (Math.hypot(x - ship.x, y - ship.y) < 200);
      rocks.push(makeRock(x, y, 3));
    }
    levelMsgTimer = 120;
  }

  const SIZES = { 3: 52, 2: 28, 1: 14 };
  function makeRock(x, y, size) {
    const r = SIZES[size];
    const sp = rand(0.5, 1.2) * (4 - size) * 0.6 + level * 0.1;
    const dir = rand(0, Math.PI * 2);
    const n = 10 + Math.floor(Math.random() * 4);
    const shape = Array.from({ length: n }, (_, i) =>
      ({ a: i / n * Math.PI * 2, d: rand(0.7, 1.15) }));
    return { x, y, r, size, vx: Math.cos(dir) * sp, vy: Math.sin(dir) * sp,
             rot: rand(0, 6.28), vr: rand(-0.02, 0.02), shape };
  }

  function burst(x, y, n, color, speed = 3) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand(0.3, 1) * speed;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                       life: rand(25, 55), max: 55, color });
    }
  }

  // ---- Update ----
  function update() {
    if (state !== 'playing') { shootPressed = false; drift(); return; }

    // Ship
    if (keys.ArrowLeft) ship.a -= 0.07;
    if (keys.ArrowRight) ship.a += 0.07;
    ship.thrust = !!keys.ArrowUp;
    if (ship.thrust) {
      ship.vx += Math.cos(ship.a) * 0.12;
      ship.vy += Math.sin(ship.a) * 0.12;
      particles.push({
        x: ship.x - Math.cos(ship.a) * 12, y: ship.y - Math.sin(ship.a) * 12,
        vx: -Math.cos(ship.a) * 2 + rand(-0.4, 0.4), vy: -Math.sin(ship.a) * 2 + rand(-0.4, 0.4),
        life: 18, max: 18, color: '255,160,60' });
    }
    if (keys.ArrowDown) { ship.vx *= 0.96; ship.vy *= 0.96; } // brake
    ship.vx *= 0.995; ship.vy *= 0.995;
    const sp = Math.hypot(ship.vx, ship.vy);
    if (sp > 7) { ship.vx *= 7 / sp; ship.vy *= 7 / sp; }
    ship.x += ship.vx; ship.y += ship.vy; wrap(ship);
    if (ship.invuln > 0) ship.invuln--;
    if (ship.cool > 0) ship.cool--;

    if ((keys.Space || shootPressed) && ship.cool === 0) {
      bullets.push({ x: ship.x + Math.cos(ship.a) * 16, y: ship.y + Math.sin(ship.a) * 16,
                     vx: ship.vx + Math.cos(ship.a) * 9, vy: ship.vy + Math.sin(ship.a) * 9,
                     life: 70, r: 2 });
      ship.cool = 10;
    }
    shootPressed = false;

    // Bullets
    for (const b of bullets) { b.x += b.vx; b.y += b.vy; b.life--; wrap(b); }
    bullets = bullets.filter(b => b.life > 0);

    // Rocks
    for (const r of rocks) { r.x += r.vx; r.y += r.vy; r.rot += r.vr; wrap(r); }

    // Bullet vs rock
    for (const b of bullets) {
      for (const r of rocks) {
        if (!r.dead && dist(b, r) < r.r) {
          b.life = 0; r.dead = true;
          score += { 3: 20, 2: 50, 1: 100 }[r.size];
          burst(r.x, r.y, 14 + r.size * 4, '120,220,255', 2.5 + r.size * 0.5);
          shake = Math.max(shake, r.size * 2);
          if (r.size > 1) {
            rocks.push(makeRock(r.x, r.y, r.size - 1), makeRock(r.x, r.y, r.size - 1));
          }
          break;
        }
      }
    }
    rocks = rocks.filter(r => !r.dead);
    bullets = bullets.filter(b => b.life > 0);

    // Ship vs rock
    if (ship.invuln === 0) {
      for (const r of rocks) {
        if (dist(ship, r) < r.r * 0.9 + ship.r * 0.6) {
          burst(ship.x, ship.y, 40, '255,255,255', 5);
          shake = 14;
          lives--;
          if (lives <= 0) state = 'over';
          else resetShip();
          break;
        }
      }
    }

    if (state === 'playing' && rocks.length === 0) { level++; spawnLevel(); ship.invuln = 120; }
    drift();
  }

  function drift() {
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
    particles = particles ? particles.filter(p => p.life > 0) : [];
    if (state !== 'playing' && rocks) for (const r of rocks) { r.x += r.vx; r.y += r.vy; r.rot += r.vr; wrap(r); }
    shake *= 0.9;
  }

  // ---- Draw ----
  function glowStroke(color, width, blur) {
    ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.shadowColor = color; ctx.shadowBlur = blur;
  }

  function drawShip() {
    if (ship.invuln > 0 && Math.floor(ship.invuln / 6) % 2) return;
    ctx.save();
    ctx.translate(ship.x, ship.y); ctx.rotate(ship.a);
    glowStroke('#7fffd4', 2, 15);
    ctx.beginPath();
    ctx.moveTo(18, 0); ctx.lineTo(-12, 11); ctx.lineTo(-7, 0); ctx.lineTo(-12, -11);
    ctx.closePath(); ctx.stroke();
    if (ship.thrust) {
      glowStroke('#ffa040', 2, 18);
      ctx.beginPath();
      ctx.moveTo(-8, 5); ctx.lineTo(-18 - Math.random() * 8, 0); ctx.lineTo(-8, -5);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawRock(r) {
    ctx.save();
    ctx.translate(r.x, r.y); ctx.rotate(r.rot);
    glowStroke('#a0b4ff', 2, 12);
    ctx.fillStyle = 'rgba(80,100,200,0.08)';
    ctx.beginPath();
    r.shape.forEach((p, i) => {
      const x = Math.cos(p.a) * r.r * p.d, y = Math.sin(p.a) * r.r * p.d;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function text(str, x, y, size, color = '#fff', align = 'center') {
    ctx.save();
    ctx.font = `${size}px "Courier New", monospace`;
    ctx.textAlign = align; ctx.fillStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = 12;
    ctx.fillText(str, x, y);
    ctx.restore();
  }

  function draw() {
    // background with trail-less clear + gradient
    const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, '#0e1230'); g.addColorStop(1, '#03040a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // parallax stars (shift opposite to ship velocity)
    ctx.fillStyle = '#fff';
    const t = performance.now() / 1000;
    for (const s of stars) {
      if (ship && state === 'playing') {
        s.x = (s.x - ship.vx * s.z * 0.0003 + 1) % 1;
        s.y = (s.y - ship.vy * s.z * 0.0003 + 1) % 1;
      }
      ctx.globalAlpha = s.z * (0.6 + 0.4 * Math.sin(t * 2 + s.x * 50));
      ctx.fillRect(s.x * W, s.y * H, s.z * 2, s.z * 2);
    }
    ctx.globalAlpha = 1;

    ctx.save();
    if (shake > 0.5) ctx.translate(rand(-shake, shake), rand(-shake, shake));

    if (rocks) rocks.forEach(drawRock);

    if (state === 'playing') drawShip();

    // bullets
    ctx.shadowColor = '#ff6'; ctx.shadowBlur = 14; ctx.fillStyle = '#ffd';
    if (bullets) for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = `rgb(${p.color})`;
      ctx.shadowColor = `rgb(${p.color})`; ctx.shadowBlur = 8;
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    ctx.restore();

    // HUD
    if (state !== 'title') {
      text('SCORE ' + String(score).padStart(6, '0'), 20, 36, 22, '#7fffd4', 'left');
      text('LEVEL ' + level, W / 2, 36, 22, '#a0b4ff');
      for (let i = 0; i < lives; i++) {
        ctx.save();
        ctx.translate(W - 30 - i * 28, 30); ctx.rotate(-Math.PI / 2);
        glowStroke('#7fffd4', 1.5, 8);
        ctx.beginPath();
        ctx.moveTo(10, 0); ctx.lineTo(-7, 6); ctx.lineTo(-4, 0); ctx.lineTo(-7, -6);
        ctx.closePath(); ctx.stroke();
        ctx.restore();
      }
    }
    if (state === 'playing' && levelMsgTimer > 0) {
      levelMsgTimer--;
      ctx.globalAlpha = Math.min(1, levelMsgTimer / 40);
      text('LEVEL ' + level, W / 2, H / 3, 48, '#fff');
      ctx.globalAlpha = 1;
    }
    if (state === 'title') {
      text('ASTEROIDS', W / 2, H / 2 - 40, 72, '#7fffd4');
      text('← →  turn     ↑  thrust     ↓  brake     SPACE  fire', W / 2, H / 2 + 20, 20, '#a0b4ff');
      if (Math.floor(t * 2) % 2) text('PRESS ENTER TO START', W / 2, H / 2 + 80, 26, '#fff');
    }
    if (state === 'over') {
      text('GAME OVER', W / 2, H / 2 - 20, 64, '#ff6a8a');
      text('Final score: ' + score, W / 2, H / 2 + 30, 26, '#fff');
      if (Math.floor(t * 2) % 2) text('PRESS ENTER TO PLAY AGAIN', W / 2, H / 2 + 80, 22, '#7fffd4');
    }
  }

  // Title screen backdrop: a few drifting rocks
  level = 1; score = 0; lives = 0; bullets = []; particles = [];
  ship = { x: W / 2, y: H / 2, vx: 0, vy: 0 };
  rocks = Array.from({ length: 6 }, () => makeRock(rand(0, W), rand(0, H), 3));

  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();
})();
</script>
</body>
</html>
